spring.application.name=limited-goods

spring.datasource.url=jdbc:postgresql://localhost:5432/limited_goods
spring.datasource.username=limited_goods
spring.datasource.password=limited_goods

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health,prometheus

# 결제 시작 기한(P1, P6)과 재처리. 값은 초기값이며 측정 결과로 조정한다(04 설계).
limited-goods.purchase.payment-window=5m
limited-goods.purchase.expiry-batch-size=100
limited-goods.reprocessing.enabled=true
limited-goods.reprocessing.interval=PT1S
